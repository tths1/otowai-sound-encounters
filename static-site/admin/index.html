<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>音逢｜规则管理</title>
  <style>
    :root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f0e7;color:#231f20}.card{box-sizing:border-box;width:min(92vw,460px);padding:32px;border:1px solid #d8cdbd;border-radius:18px;background:#fffaf1;box-shadow:0 18px 50px #4b382018}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#9f2d25;color:white;font:700 25px serif}h1{margin:18px 0 6px;font-family:serif}p{color:#756b61;line-height:1.6}form{display:grid;gap:14px;margin-top:24px}label{display:grid;gap:6px;font-size:14px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cfc3b4;border-radius:9px;background:white;color:#231f20;font:inherit}button,.button{display:inline-flex;justify-content:center;box-sizing:border-box;padding:12px 16px;border:0;border-radius:9px;background:#9f2d25;color:white;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.secondary{background:#39332e}#admin-status[data-error="true"]{color:#a11f1f}[hidden]{display:none!important}@media(prefers-color-scheme:dark){body{background:#161412;color:#f6efe4}.card{background:#24201c;border-color:#443b33}p{color:#b9afa4}input{background:#181512;color:#f6efe4;border-color:#544940}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">音</div>
    <h1>规则管理端</h1>
    <p>仅受邀请的管理员可以进入并修改网站的同音字映射。</p>
    <p id="admin-status" role="status"></p>
    <form id="admin-login-form">
      <label>管理员邮箱<input type="email" name="email" autocomplete="username" required></label>
      <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">登录</button>
    </form>
    <form id="admin-invite-form" hidden>
      <label>设置密码<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
      <label>再次输入密码<input type="password" name="confirm" minlength="8" autocomplete="new-password" required></label>
      <button type="submit">接受邀请并登录</button>
    </form>
    <section id="admin-account" hidden>
      <p>已登录：<strong></strong></p>
      <p><a class="button" href="/admin/editor/#maker">进入映射规则编辑</a></p>
      <button class="secondary" id="admin-logout" type="button">退出登录</button>
    </section>
  </main>
  <script type="module" src="admin-auth.js"></script>
</body>
</html>
